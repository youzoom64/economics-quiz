<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>経済 4択問題集［中級］</title>
<link rel="stylesheet" href="assets/quiz.css">
</head>
<body>
<div class="wrap">
  <h1>経済 4択問題集<span class="badge lv2">中級</span></h1>
  <p class="lead">全20問・制度と指標／簡単な計算あり／正誤は最後にまとめて発表します</p>

  <div class="card" id="quiz">
    <div class="bar"><i id="prog"></i></div>
    <div class="meta"><span id="count"></span></div>
    <p class="q" id="qtext"></p>
    <div class="opts" id="opts"></div>
  </div>

  <div class="card hide" id="result">
    <div class="meta">結果</div>
    <div class="score"><span id="sc"></span><small> / <span id="tt"></span> 問正解</small></div>
    <div class="rank" id="rank"></div>
    <button class="next" id="retry">もう一度挑戦する</button>
    <ul class="rev" id="rev"></ul>
  </div>

  <a class="back" href="index.html">← レベル選択に戻る</a>
</div>

<script>
const RANKS = [
  "満点！ 中級は完璧です。上級に挑戦しましょう",
  "優秀。制度と指標をよく理解しています",
  "合格ライン。取りこぼした分野を潰しましょう",
  "もう一歩。計算問題と指標の定義を復習しましょう",
  "初級に戻って用語を固めるのが近道です"
];

const QUESTIONS = [
  {q:"国民経済計算における「三面等価の原則」の説明として正しいものはどれか。",
   c:["生産・分配・支出のどの面から測ってもGDPは事後的に一致する","国・企業・家計の3部門の収支が必ず均衡する","生産量・雇用量・物価が同時に決まる","財政・金融・為替の3政策は同じ効果を持つ"],a:0,
   e:"同じ付加価値を、作った側（生産）・受け取った側（分配＝賃金や利潤）・使った側（支出＝消費や投資）から見ているだけなので、事後的には必ず一致する。"},

  {q:"GDPとGNI（国民総所得）の関係として正しいものはどれか。",
   c:["GNI ＝ GDP ＋ 海外からの純所得受取","GNI ＝ GDP − 固定資本減耗","GNI ＝ GDP ＋ 輸出 − 輸入","GNIとGDPは常に一致する"],a:0,
   e:"GDPは「国内」で生み出された付加価値、GNIは「国民（居住者）」が受け取った所得。日本人が海外で稼いだ所得を足し、外国人が日本で稼いだ分を引くと GNI になる。"},

  {q:"ある財の需要曲線そのものを右にシフトさせる要因はどれか。",
   c:["消費者の所得が増加した（正常財の場合）","その財の価格が下落した","その財の生産技術が向上した","その財の原材料費が下がった"],a:0,
   e:"価格の変化は「曲線上の移動」で、曲線自体は動かない。所得・嗜好・関連財の価格・人口などが変わると曲線がシフトする。技術向上や原材料費の低下は供給曲線をシフトさせる要因。"},

  {q:"コーヒーの価格が上昇したとき、紅茶の需要が増加した。この2財の関係と、バターとパンのような関係の呼び名の組み合わせはどれか。",
   c:["コーヒーと紅茶は代替財、バターとパンは補完財","コーヒーと紅茶は補完財、バターとパンは代替財","どちらも代替財である","どちらも補完財である"],a:0,
   e:"一方の価格が上がると他方の需要が増えるのが代替財（交差弾力性がプラス）。一緒に消費され、一方が値上がりすると他方の需要も減るのが補完財（交差弾力性がマイナス）。"},

  {q:"経済学的に合理的な意思決定における「サンクコスト（埋没費用）」の扱いはどれか。",
   c:["すでに支出済みで回収できないため、今後の判断材料に含めない","必ず回収できるまで事業を続ける根拠にする","固定費と同じく毎期の費用に上乗せする","機会費用と同じ意味なので必ず考慮する"],a:0,
   e:"今後の選択によって変わらない費用は、どの選択肢でも同じなので比較に影響しない。「ここまで投資したのだから」と続けるのはコンコルド効果と呼ばれる不合理な判断。"},

  {q:"限界消費性向が0.6の閉鎖経済で、政府支出を5兆円増やしたとき、均衡GDPはいくら増加するか。",
   c:["12.5兆円","5兆円","3兆円","8兆円"],a:0,
   e:"政府支出乗数 = 1/(1−0.6) = 2.5。5兆円 × 2.5 = 12.5兆円。限界消費性向が大きいほど乗数も大きくなる。"},

  {q:"財政の「ビルトインスタビライザー（自動安定化装置）」の例として適切なものはどれか。",
   c:["累進課税と雇用保険の失業給付","不況時に決定される補正予算の公共投資","日本銀行による国債の買い入れ","消費税率の引き上げ"],a:0,
   e:"景気が過熱すれば税収が自動的に増えて需要を抑え、不況になれば税負担が減り給付が増えて需要を下支えする。裁量的な補正予算や利下げは政策判断を伴うのでフィスカル・ポリシー／金融政策。"},

  {q:"プライマリーバランス（基礎的財政収支）の定義として正しいものはどれか。",
   c:["国債費を除く歳出と、国債発行収入を除く歳入との収支","歳入と歳出の単純な差額","国債残高の対GDP比","経常収支と資本収支の合計"],a:0,
   e:"過去の借金の元利払い（国債費）と新規の借金（公債金収入）を除いた収支で、その年の政策的経費を税収などで賄えているかを示す。均衡していても金利分だけ債務残高は増えうる点に注意。"},

  {q:"財政法が定める、国債に関する原則はどれか。",
   c:["日本銀行が国債を直接引き受けることは原則として禁止されている（市中消化の原則）","国債の発行そのものが全面的に禁止されている","国債は必ず日本銀行が引き受けなければならない","国債発行には国民投票が必要である"],a:0,
   e:"中央銀行が直接引き受けると歯止めのない通貨増発とインフレを招くため、財政法第5条で原則禁止。建設国債は同法で認められ、赤字国債は特例法によって毎年度発行されている。"},

  {q:"直接金融に分類されるものはどれか。",
   c:["企業が社債や株式を発行して投資家から資金を調達する","企業が銀行から融資を受ける","個人が銀行に預金する","企業が信用金庫で手形を割り引く"],a:0,
   e:"資金の出し手と受け手が証券市場で直接結びつくのが直接金融。銀行が預金を集めて貸し出す形は、銀行が仲立ちする間接金融。"},

  {q:"現在の日本銀行の金融調節に関する記述として正しいものはどれか。",
   c:["主たる手段は公開市場操作で、買いオペは短期市場金利を低下させる","公定歩合の変更が現在も主たる政策手段である","預金準備率の変更が毎月行われている","金融政策は財務大臣が決定する"],a:0,
   e:"金利自由化以降、公定歩合（現・基準割引率）操作は主役ではなくなり、オペレーションが中心。政策は日銀の金融政策決定会合で決まり、政府から独立している。"},

  {q:"公共財の性質と、それが市場で十分供給されにくい理由の組み合わせはどれか。",
   c:["非競合性と非排除性を持ち、対価を払わない人を排除できずフリーライダーが生じるため","競合性と排除性を持ち、価格が高すぎるため","希少性がなく、そもそも需要がないため","独占企業が供給を制限するため"],a:0,
   e:"国防や一般道路が典型。皆が「他人が払うだろう」とただ乗りするため市場では過少供給になり、政府が税で供給する根拠になる。"},

  {q:"電力やガスの送配管網のように、巨額の固定費のために1社が供給した方が費用が低くなる状態を何というか。",
   c:["自然独占","カルテル","寡占","独占的競争"],a:0,
   e:"規模の経済が大きく働き、平均費用が生産量の拡大とともに下がり続けるために起きる。市場に任せると価格が高止まりするので、料金規制や公的関与の対象になりやすい。"},

  {q:"独占禁止法とその運用機関に関する記述として正しいものはどれか。",
   c:["カルテルや不公正な取引方法を禁止し、公正取引委員会が運用する","企業の合併をすべて禁止し、経済産業省が運用する","独占企業の利潤に課税する制度で、国税庁が運用する","中小企業の保護のみを目的とし、中小企業庁が運用する"],a:0,
   e:"独占禁止法は私的独占・不当な取引制限（カルテル・談合）・不公正な取引方法を規制する。公正取引委員会は他省庁から独立した行政委員会。"},

  {q:"他の条件を一定として、日本の金利が米国の金利より相対的に上昇した場合、為替レートは一般にどう動くか。",
   c:["円で運用する魅力が増して円買いが起こり、円高に向かう","円売りが起こり、円安に向かう","内外金利差は為替に影響しない","必ず固定相場に移行する"],a:0,
   e:"金利の高い通貨に資金が流れる（金利平価の考え方）。近年の急速な円安も、日米金利差の拡大が主因の一つとして説明されることが多い。"},

  {q:"日本の経常収支の内訳のうち、海外への投資から得られる利子・配当が計上されるのはどれか。",
   c:["第一次所得収支","貿易収支","サービス収支","第二次所得収支"],a:0,
   e:"近年の日本は貿易収支が赤字の年でも、対外資産から得られる第一次所得収支の大幅黒字によって経常収支黒字を保つ構造になっている。無償援助や送金は第二次所得収支。"},

  {q:"日本で「コアCPI」と呼ばれる指標はどれか。",
   c:["生鮮食品を除く総合指数","すべての品目を含む総合指数","生鮮食品およびエネルギーを除く総合指数","企業間で取引される財の価格指数"],a:0,
   e:"天候で振れやすい生鮮食品を除いたのがコア。さらにエネルギーも除いたものは「コアコア」と呼ばれる。企業間取引の価格は企業物価指数（CGPI）。"},

  {q:"名目賃金が前年比3％上昇し、消費者物価が5％上昇した。実質賃金はどうなったか。",
   c:["およそ2％低下した","およそ2％上昇した","およそ8％上昇した","変化していない"],a:0,
   e:"実質賃金上昇率 ≒ 名目賃金上昇率 − 物価上昇率 = 3 − 5 = −2％。名目の給料が上がっても、物価の上昇がそれを上回れば購買力は落ちる。"},

  {q:"ある輸入品に関税を課したときに生じる効果として正しいものはどれか。",
   c:["国内価格が上昇して国内生産者は保護されるが、消費者の負担は増え社会全体では死荷重が生じる","国内価格が下がり消費者が得をする","国内生産者・消費者ともに利益を得る","貿易量は変わらず、政府の税収だけが増える"],a:0,
   e:"関税で国内価格が上がると生産者余剰と関税収入は増えるが、それを上回る消費者余剰の減少が生じ、差し引きで死荷重（厚生損失）が残る。"},

  {q:"名目GDP成長率が1％、実質GDP成長率が2％であったとき、GDPデフレーターの変化率はおよそいくらか。",
   c:["−1％（物価は下落）","＋1％（物価は上昇）","＋3％（物価は上昇）","0％（物価は横ばい）"],a:0,
   e:"名目成長率 ≒ 実質成長率 ＋ デフレーター上昇率 なので、1 − 2 = −1％。実質が名目を上回るときは物価が下がっている（デフレ）状態を意味する。"}
];
</script>
<script src="assets/quiz.js"></script>
</body>
</html>
