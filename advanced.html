<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>経済 4択問題集［上級］</title>
<link rel="stylesheet" href="assets/quiz.css">
</head>
<body>
<div class="wrap">
  <h1>経済 4択問題集<span class="badge lv3">上級</span></h1>
  <p class="lead">全20問・ミクロ／マクロ理論と計算問題／正誤は最後にまとめて発表します</p>

  <div class="card" id="quiz">
    <div class="bar"><i id="prog"></i></div>
    <div class="meta"><span id="count"></span></div>
    <p class="q" id="qtext"></p>
    <div class="opts" id="opts"></div>
  </div>

  <div class="card hide" id="result">
    <div class="meta">結果</div>
    <div class="score"><span id="sc"></span><small> / <span id="tt"></span> 問正解</small></div>
    <div class="rank" id="rank"></div>
    <button class="next" id="retry">もう一度挑戦する</button>
    <ul class="rev" id="rev"></ul>
  </div>

  <a class="back" href="index.html">← レベル選択に戻る</a>
</div>

<script>
const RANKS = [
  "満点。主要論点を完全に押さえています",
  "上級合格ライン。ミクロ・マクロともに実力十分",
  "健闘。落とした分野の解説を潰せば一段上がります",
  "基本論点は取れています。計算問題を重点復習しましょう",
  "中級で土台を固めてから再挑戦しましょう"
];

const QUESTIONS = [
  {q:"閉鎖経済で限界消費性向が0.8、租税は定額税、投資は利子率・所得に依存しないものとする。政府支出を5兆円増やしたとき、均衡GDPはいくら増加するか。",
   c:["25兆円","5兆円","20兆円","6.25兆円"],a:0,
   e:"政府支出乗数 = 1/(1−限界消費性向) = 1/0.2 = 5。よって 5兆円 × 5 = 25兆円。20兆円は減税乗数 c/(1−c) = 4 を使った場合の値で、引っかけ。"},

  {q:"政府支出と租税（定額税）を同時に、いずれも10兆円増やした。均衡GDPはどうなるか。",
   c:["限界消費性向の値にかかわらず10兆円増加する","限界消費性向が0.8なら50兆円増加する","変化しない（財政中立）","限界消費性向が大きいほど減少する"],a:0,
   e:"均衡予算乗数の定理。政府支出乗数 1/(1−c) と減税乗数 −c/(1−c) の和は (1−c)/(1−c) = 1 になるため、乗数はcの値によらず常に1。"},

  {q:"あるガソリンの需要の価格弾力性は0.4であった。この財の価格を10％引き上げたとき、需要量と販売収入はどうなるか。",
   c:["需要量は4％減少し、販売収入は増加する","需要量は4％減少し、販売収入は減少する","需要量は40％減少し、販売収入は減少する","需要量は4％減少し、販売収入は変わらない"],a:0,
   e:"弾力性0.4＝非弾力的。価格上昇率10％より需要減少率4％の方が小さいので、価格×数量である収入は増える。弾力性が1なら収入不変、1より大きければ収入減。"},

  {q:"「流動性の罠」に陥った経済の説明として正しいものはどれか。",
   c:["貨幣需要の利子弾力性が極めて大きくLM曲線が水平になり、金融緩和が利子率を下げられない","貨幣需要の利子弾力性がゼロで、LM曲線が垂直になる","投資の利子弾力性が大きく、財政政策が無効になる","物価が上がり続けて貨幣が退蔵される状態"],a:0,
   e:"名目利子率が下限に達すると、増やした貨幣がすべて投機的動機で保有され利子率が下がらない。LMが水平なので金融政策は無効で、逆に財政政策はクラウディングアウトなしに効く。"},

  {q:"IS-LM分析において、拡張的財政政策のクラウディングアウトが完全に生じ、GDPがまったく増加しないのはどの場合か。",
   c:["LM曲線が垂直（貨幣需要の利子弾力性がゼロ）のとき","LM曲線が水平のとき","IS曲線が垂直（投資の利子弾力性がゼロ）のとき","IS曲線が水平のとき"],a:0,
   e:"LMが垂直だと財政拡張はGDPを増やせず利子率だけを押し上げ、上昇分だけ民間投資が減って完全に押し出される。逆にIS垂直＝投資が利子率に反応しないなら、クラウディングアウトは起きない。"},

  {q:"名目利子率が1％、期待インフレ率が−2％（デフレ予想）のとき、フィッシャー方程式による近似の実質利子率はいくらか。",
   c:["3％","−1％","1％","−2％"],a:0,
   e:"実質利子率 ≒ 名目利子率 − 期待インフレ率 = 1 − (−2) = 3％。デフレ下では名目金利をゼロまで下げても実質金利が高止まりし、借り手の実質債務負担が重くなる。"},

  {q:"資本移動が完全に自由な小国開放経済において、変動相場制のもとで拡張的財政政策を行った場合の効果はどれか（マンデル＝フレミング・モデル）。",
   c:["自国通貨高により純輸出が減り、産出量は増えない","自国通貨安により純輸出が増え、産出量が大きく増える","産出量も利子率も大きく上昇する","金融政策と同じく強い景気拡大効果を持つ"],a:0,
   e:"財政拡張→利子率上昇圧力→資本流入→自国通貨高→純輸出減少、で完全に相殺される。変動相場制では財政政策が無効で金融政策が有効、固定相場制ではその逆になる。"},

  {q:"同一の財のバスケットが日本で1,500円、米国で10ドルで買えるとする。実際の市場レートが1ドル＝120円であるとき、購買力平価と円の評価の組み合わせとして正しいものはどれか。",
   c:["購買力平価は1ドル＝150円で、円は過大評価（割高）","購買力平価は1ドル＝150円で、円は過小評価（割安）","購買力平価は1ドル＝120円で、円は適正水準","購買力平価は1ドル＝1,500円で、円は過小評価"],a:0,
   e:"購買力平価 = 1,500円 ÷ 10ドル = 150円/ドル。実勢の120円は平価より円が高い水準なので、円は過大評価されている（＝ドルが割安）。"},

  {q:"完全競争市場の企業が、短期において生産を継続する（操業停止しない）条件はどれか。",
   c:["価格が平均可変費用の最小値以上であること","価格が平均総費用の最小値以上であること","価格が限界費用を上回っていること","利潤が正であること"],a:0,
   e:"短期は固定費が埋没費用なので、可変費用さえ回収できれば操業した方が損失は小さい。平均可変費用の最小点が操業停止点、平均総費用の最小点は損益分岐点。"},

  {q:"利潤最大化を行う独占企業が直面する需要の価格弾力性が2、限界費用が600円であるとき、独占価格はいくらか。",
   c:["1,200円","600円","900円","300円"],a:0,
   e:"限界収入 MR = P(1 − 1/ε)、利潤最大化条件は MR = MC。P(1 − 1/2) = 600 → 0.5P = 600 → P = 1,200円。弾力性が小さいほどマークアップ率は大きくなる。"},

  {q:"生産に負の外部性（外部不経済）を伴う財について、政府が介入しない市場均衡の特徴として正しいものはどれか。",
   c:["私的限界費用が社会的限界費用を下回るため、社会的最適より生産量が過大になる","私的限界費用が社会的限界費用を上回るため、生産量が過少になる","生産量は社会的最適と一致するが、価格だけが低くなる","死荷重は発生しない"],a:0,
   e:"企業は外部費用を負担しないので費用を過小評価し、作りすぎになる（死荷重が発生）。外部限界費用に等しい税＝ピグー税を課すと外部性が内部化され、最適水準に戻る。"},

  {q:"コースの定理の内容として正しいものはどれか。",
   c:["取引費用が無視でき所有権が明確なら、権利の初期配分にかかわらず交渉によって効率的な資源配分が実現する","外部性の解決には必ず政府による課税が必要である","所有権をどちらに与えるかによって、資源配分の効率性が大きく変わる","公共財は市場では必ず過剰供給される"],a:0,
   e:"初期配分が変わっても効率性は変わらないが、所得分配は変わる点に注意。当事者が多数で交渉費用が大きい公害問題などでは成立しにくく、そこに政府介入の余地が生じる。"},

  {q:"次のうち「逆選択」の例として最も適切なものはどれか。",
   c:["中古車市場で品質の悪い車ばかりが売りに出され、良質な車が市場から退出する","火災保険に入った人が火の用心を怠るようになる","医師が患者に必要以上の検査を勧める","経営者が株主の利益より自分の報酬を優先する"],a:0,
   e:"逆選択は契約「前」の情報の非対称性（隠された情報）で起きる。アカロフのレモン市場が典型。残りの3つは契約後の行動に起因するモラルハザード／エージェンシー問題。"},

  {q:"1回限りの同時手番で行われる典型的な囚人のジレンマにおける結果として正しいものはどれか。",
   c:["双方が裏切る組み合わせが唯一のナッシュ均衡であり、それはパレート効率的でない","双方が協調する組み合わせがナッシュ均衡になる","ナッシュ均衡は存在しない","ナッシュ均衡は必ずパレート効率的である"],a:0,
   e:"裏切りは相手の戦略によらず有利な支配戦略なので、双方裏切りが均衡。しかし双方協調の方が両者とも得であり、個人合理性と集団合理性が食い違う。"},

  {q:"ジニ係数の説明として正しいものはどれか。",
   c:["ローレンツ曲線と均等分布線で囲まれた面積の2倍で、0に近いほど平等である","ローレンツ曲線の傾きそのもので、1に近いほど平等である","消費支出に占める食料費の割合を示す","値は0から100までをとり、100が完全平等を意味する"],a:0,
   e:"完全平等ならローレンツ曲線は45度線と一致してジニ係数は0、1人がすべての所得を得る完全不平等なら1。食料費の割合はエンゲル係数。"},

  {q:"次のうち、日本のGDPに計上されるものはどれか。",
   c:["持ち家の帰属家賃","保有株式の売却益（キャピタルゲイン）","中古住宅そのものの売買代金","公的年金の給付額"],a:0,
   e:"持ち家は自分に家賃を払って住宅サービスを生産しているとみなし推計計上する。キャピタルゲインや移転支出は新たな付加価値ではないので不算入。中古住宅も生産は過去に計上済みで、当年に計上されるのは仲介手数料だけ。"},

  {q:"法定準備率が10％、ある市中銀行に100億円の本源的預金があるとする。銀行が超過準備を保有せず現金流出もない場合、信用創造によって新たに生み出される預金（派生預金）の合計はいくらか。",
   c:["900億円","1,000億円","100億円","90億円"],a:0,
   e:"預金総額 = 本源的預金 ÷ 準備率 = 100 ÷ 0.1 = 1,000億円。そこから元の100億円を引いた900億円が新たに創造された派生預金。1,000億円は預金総額なので引っかけ。"},

  {q:"自然失業率仮説（フリードマンら）に基づく長期フィリップス曲線の形状と含意はどれか。",
   c:["自然失業率の水準で垂直となり、長期にはインフレ率と失業率のトレードオフは存在しない","右下がりのままで、長期でもインフレを許容すれば失業を減らせる","水平となり、失業率は金融政策で自由に決められる","右上がりとなり、インフレと失業が同時に悪化する"],a:0,
   e:"短期には予想外のインフレが失業を減らすが、長期には人々の予想が実際のインフレに追いつくため失業率は自然失業率に戻る。金融政策が長期的に決められるのは失業率ではなくインフレ率だけ、という含意を持つ。"},

  {q:"A国は1単位の生産にX財2時間・Y財4時間、B国はX財6時間・Y財8時間を要する。比較優位に関する記述として正しいものはどれか。",
   c:["A国はX財に、B国はY財に比較優位を持ち、特化と交換で双方が利益を得られる","B国は両財とも絶対劣位なので、貿易から利益を得られない","A国は両財で生産性が高いので、両財に比較優位を持つ","A国はY財に、B国はX財に比較優位を持つ"],a:0,
   e:"X財1単位の機会費用はA国が 2/4 ＝ 0.5単位のY財、B国が 6/8 ＝ 0.75単位のY財。安いA国がX財に比較優位で、裏返しにB国はY財に比較優位。絶対劣位でも比較優位は必ず存在し、貿易の利益が生じる（リカード）。"},

  {q:"ある財の需要曲線が P = 100 − Q（Pは価格・円、Qは数量・個）で表される。市場価格が40円のとき、消費者余剰はいくらか。",
   c:["1,800円","3,600円","2,400円","1,200円"],a:0,
   e:"P=40 のとき Q=60。消費者余剰は需要曲線と価格線に挟まれた三角形の面積なので、(100−40) × 60 ÷ 2 = 1,800円。÷2 を忘れると3,600円になる。"}
];
</script>
<script src="assets/quiz.js"></script>
</body>
</html>
